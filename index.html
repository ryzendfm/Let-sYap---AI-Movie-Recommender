<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let'sYap 3.0</title>
    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Lora:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    <!-- 3. Add marked.js library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* --- GLOBAL STYLES --- */
        body {
            font-family: 'Manrope', sans-serif;
            color: #ffffff;
            background-color: #0a0a0a;
            /* Ensure background covers everything */
            background-attachment: fixed; 
            background-color: rgba(0, 0, 0, 0.5); 
            background-blend-mode: overlay;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        .font-serif-italic {
            font-family: 'Lora', serif;
            font-style: italic;
            font-weight: 700;
        }

        /* --- SCROLLBARS --- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* --- ANIMATIONS --- */
        .elegant-spinner {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CUSTOM CURSOR (Desktop Only) --- */
        @media (min-width: 769px) {
            body, a, button, input {
                cursor: none;
            }
            .cursor-dot, .cursor-follower {
                position: fixed;
                top: 0;
                left: 0;
                transform: translate(-50%, -50%);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                mix-blend-mode: exclusion;
                background-color: white;
            }
            .cursor-dot { width: 8px; height: 8px; }
            .cursor-follower { 
                width: 30px; height: 30px; 
                background-color: rgba(255,255,255,0.2);
                transition: width 0.2s, height 0.2s, transform 0.1s;
            }
        }
        @media (max-width: 768px) {
            .cursor-dot, .cursor-follower { display: none; }
        }

        /* --- MODAL --- */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9); /* Darker background */
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal.open { opacity: 1; visibility: visible; }
        
        .modal-content {
            width: 90vw;
            max-width: 900px;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
    </style>
</head>
<body class="w-full min-h-screen overflow-hidden" style="background-image: url('https://framerusercontent.com/images/34O2HYfrgXuRFoJZrHtUPDH68bE.png?scale-down-to=2048&width=2912&height=1632'); background-size: cover; background-position: center center;">

    <!-- Custom Cursor -->
    <div id="cursor-dot" class="cursor-dot"></div>
    <div id="cursor-follower" class="cursor-follower"></div>

    <!-- Header (Fixed) -->
    <header id="main-header" class="fixed top-0 left-0 w-full flex justify-center items-center py-6 z-20 pointer-events-none transition-all duration-500 ease-in-out">
        <h3 class="text-2xl font-extrabold tracking-tight text-white drop-shadow-md">Let'sYap <span class="text-xs font-normal opacity-60 ml-1">v2.5</span></h3>
    </header>

    <!-- Main Content Area -->
    <!-- pb-36 ensures content doesn't get hidden behind the fixed footer -->
    <main id="main-scroll" class="w-full h-screen overflow-y-auto pb-40 px-4 md:px-6 pt-20 scroll-smooth">
        
        <!-- Welcome Screen (Centered) -->
        <div id="initial-view" class="w-full max-w-4xl mx-auto flex flex-col items-center justify-center min-h-[60vh] text-center transition-all duration-500">
            <h1 class="text-5xl md:text-7xl font-extrabold text-white leading-tight tracking-tight drop-shadow-lg">
                Discover your <br>
                <span class="font-serif-italic text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">next favorite movie.</span>
            </h1>
            <p class="mt-6 text-lg text-gray-300 max-w-lg mx-auto drop-shadow-md">
                Powered by Gemini 2.5 Pro & TMDB. <br> Compare films, find hidden gems, or get personalized picks.
            </p>
            
            <!-- Quick Action Chips -->
            <div class="mt-10 flex flex-wrap gap-3 justify-center w-full">
                <button class="suggestion-chip px-5 py-2.5 bg-white/10 hover:bg-white/20 border border-white/10 rounded-full text-sm font-medium backdrop-blur-md transition-all cursor-pointer">Suggest a random movie</button>
                <button class="suggestion-chip px-5 py-2.5 bg-white/10 hover:bg-white/20 border border-white/10 rounded-full text-sm font-medium backdrop-blur-md transition-all cursor-pointer">Compare Inception vs Interstellar</button>
                <button class="suggestion-chip px-5 py-2.5 bg-white/10 hover:bg-white/20 border border-white/10 rounded-full text-sm font-medium backdrop-blur-md transition-all cursor-pointer">Movies with Leonardo DiCaprio</button>
            </div>
        </div>

        <!-- Chat Container (Where messages appear) -->
        <div id="chat-container" class="w-full max-w-3xl mx-auto space-y-6 pb-4"></div>

    </main>

    <!-- Footer / Input Area (Fixed Bottom) -->
    <footer class="fixed bottom-0 left-0 w-full p-4 z-30 bg-gradient-to-t from-black via-black/80 to-transparent">
        <div class="w-full max-w-3xl mx-auto relative">
            <!-- Input Box: Pill Shaped -->
            <div class="bg-black/60 backdrop-blur-xl border border-white/20 rounded-full shadow-2xl flex items-center p-2 transition-all focus-within:border-white/40 focus-within:bg-black/80">
                <input type="text" id="user-input" 
                    class="flex-1 bg-transparent text-white placeholder-gray-400 px-6 py-3 outline-none text-base min-w-0" 
                    autocomplete="off"
                    placeholder="Ask for a recommendation, comparison, or movie info...">
                
                <button id="send-button" class="bg-white text-black hover:bg-gray-200 p-3 rounded-full font-bold transition-colors flex items-center justify-center group disabled:opacity-50 disabled:cursor-not-allowed w-12 h-12 flex-shrink-0 ml-2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 group-hover:translate-x-0.5 transition-transform">
                        <path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z" />
                    </svg>
                </button>
            </div>
            <div class="text-center mt-3">
                <p class="text-[10px] text-gray-400 font-medium">&bull; Developed by Sooriyaa (Ryz.)</p>
            </div>
        </div>
    </footer>

    <!-- Video Modal -->
    <div id="trailer-modal" class="modal">
        <div class="modal-content">
            <button id="close-modal" class="absolute top-4 right-4 z-50 bg-black/50 hover:bg-black/80 text-white rounded-full w-10 h-10 flex items-center justify-center text-2xl backdrop-blur-sm transition-colors">&times;</button>
            <div class="video-wrapper">
                <iframe id="trailer-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        // ==========================================
        // CONFIGURATION & API KEYS
        // ==========================================
        const GEMINI_API_KEY = "AIzaSyA4kxWwjE1dXYPKXXW9WMvNa4auozIK1YI"; 
        const TMDB_API_KEY = "6c39d6b4242edaf0a6e6f9e4b56eda66"; 

        // ==========================================
        // STATE MANAGEMENT
        // ==========================================
        const STATE = {
            IDLE: 'IDLE',
            ASKING_PREFS: 'ASKING_PREFS',
            CHATTING: 'CHATTING'
        };

        let currentState = STATE.IDLE;
        let chatHistory = [];
        let userPrefs = [];
        let prefQuestions = [];
        let currentQuestionIndex = 0;
        let currentLoadingEl = null;

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const els = {
            mainScroll: document.getElementById('main-scroll'),
            initialView: document.getElementById('initial-view'),
            chatContainer: document.getElementById('chat-container'),
            input: document.getElementById('user-input'),
            sendBtn: document.getElementById('send-button'),
            trailerModal: document.getElementById('trailer-modal'),
            closeModal: document.getElementById('close-modal'),
            iframe: document.getElementById('trailer-iframe'),
            chips: document.querySelectorAll('.suggestion-chip'),
            header: document.getElementById('main-header')
        };

        // ==========================================
        // INITIALIZATION & EVENTS
        // ==========================================
        function init() {
            if (GEMINI_API_KEY.includes("YOUR_GEMINI") || TMDB_API_KEY.includes("YOUR_TMDB")) {
                addMessage('model', "⚠️ **API Keys Missing.** Please open the code file and replace `YOUR_GEMINI_API_KEY_HERE` and `YOUR_TMDB_API_KEY_HERE` with valid keys.");
                return;
            }

            // System Prompt setup
            const systemPrompt = `
You are Let'sYap, an intelligent AI movie recommender.
1. **Intent**:
   - COMPARE: Compare 2+ movies.
   - RANDOM: Suggest a random movie.
   - RECOMMEND: User wants suggestions based on taste. Ask questions.
   - SPECIFIC: Info about a specific movie title.
   - LIST_BY_ENTITY: User asks for movies BY a specific actor/director (e.g., "movies with Leo DiCaprio").
2. **Tone**: Friendly, engaging, concise.
            `;
            chatHistory.push({ role: 'user', parts: [{ text: systemPrompt }] });
            chatHistory.push({ role: 'model', parts: [{ text: "Understood. I am ready." }] });

            // Event Listeners
            els.sendBtn.addEventListener('click', handleSend);
            els.input.addEventListener('keypress', (e) => e.key === 'Enter' && handleSend());
            els.closeModal.addEventListener('click', closeModal);
            els.trailerModal.addEventListener('click', (e) => e.target === els.trailerModal && closeModal());
            document.addEventListener('keydown', (e) => e.key === 'Escape' && closeModal());

            els.chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    els.input.value = chip.textContent;
                    handleSend();
                });
            });

            // Header Scroll Logic
            els.mainScroll.addEventListener('scroll', () => {
                // If we are not in IDLE state (meaning chat is open), keep it hidden
                if (currentState !== STATE.IDLE) return;

                // Fade out header on scroll
                if (els.mainScroll.scrollTop > 20) {
                    els.header.classList.add('opacity-0', '-translate-y-10');
                } else {
                    els.header.classList.remove('opacity-0', '-translate-y-10');
                }
            });

            setupCursor();
        }

        // ==========================================
        // CORE LOGIC FLOW
        // ==========================================
        async function handleSend() {
            const text = els.input.value.trim();
            if (!text) return;

            els.input.value = '';
            
            // Hide initial view nicely
            els.initialView.classList.add('hidden');
            els.initialView.style.display = 'none'; // Enforce hide
            
            // HIDE HEADER PERMANENTLY ON CHAT START
            els.header.classList.add('opacity-0', '-translate-y-10');
            
            addMessage('user', text);
            setLoading(true);

            try {
                if (currentState === STATE.ASKING_PREFS) {
                    await handlePreferenceAnswer(text);
                } else {
                    const analysis = await classifyIntent(text);
                    console.log("Intent Analysis:", analysis);

                    switch (analysis.intent) {
                        case 'COMPARE':
                            await handleComparison(analysis.entities);
                            break;
                        case 'RANDOM':
                            await handleRandomMovie();
                            break;
                        case 'RECOMMEND':
                            // LOGIC FIX: If specific entities (actors) are mentioned, skip questions and just suggest.
                            if (analysis.entities && analysis.entities.length > 0) {
                                await generateImmediateRecommendations(text);
                            } else {
                                await startRecommendationFlow();
                            }
                            break;
                        case 'SPECIFIC':
                            await handleSpecificQuery(analysis.entities, text);
                            break;
                        default: // CHAT
                            await handleGeneralChat(text);
                            break;
                    }
                }
            } catch (error) {
                console.error(error);
                addMessage('model', "Sorry, I encountered an error. Please try again.");
            } finally {
                setLoading(false);
            }
        }

        // ==========================================
        // HANDLERS
        // ==========================================

        async function classifyIntent(userText) {
            const prompt = `
Analyze this user text: "${userText}".
Classify into:
- COMPARE: comparing 2+ movies.
- RANDOM: "random movie", "surprise me".
- RECOMMEND: "suggest a movie", "what should I watch" (general).
- SPECIFIC: asking about a specific movie ("who directed Inception", "rating of Iron Man", "Most rated transformer movie").
- LIST_BY_ENTITY: "movies with Tom Hanks", "Nolan movies". (Map this to RECOMMEND but extract entity).

Extract entities (movie titles, actor names).
Return JSON: { "intent": "STRING", "entities": ["String"] }
            `;
            const response = await callGeminiJSON(prompt);
            return response || { intent: 'CHAT', entities: [] };
        }

        // --- RECOMMENDATION LOGIC ---
        async function startRecommendationFlow() {
            currentState = STATE.ASKING_PREFS;
            userPrefs = [];
            currentQuestionIndex = 0;

            const prompt = "Generate exactly 3 short, engaging questions to understand a user's movie taste. Return JSON array of strings.";
            prefQuestions = await callGeminiJSON(prompt);
            
            if (!prefQuestions || prefQuestions.length !== 3) {
                prefQuestions = [
                    "What genre are you in the mood for today?",
                    "Do you prefer something classic or a modern release?",
                    "Name a movie you watched recently and loved."
                ];
            }

            const q = prefQuestions[0];
            addMessage('model', "Great! I'll find the perfect movie. First, " + q);
            chatHistory.push({ role: 'model', parts: [{ text: q }] });
        }

        async function handlePreferenceAnswer(answer) {
            userPrefs.push({ question: prefQuestions[currentQuestionIndex], answer: answer });
            chatHistory.push({ role: 'user', parts: [{ text: answer }] });
            currentQuestionIndex++;

            if (currentQuestionIndex < 3) {
                const nextQ = prefQuestions[currentQuestionIndex];
                addMessage('model', nextQ);
                chatHistory.push({ role: 'model', parts: [{ text: nextQ }] });
            } else {
                addMessage('model', "Thanks! Analyzing your taste...");
                currentState = STATE.CHATTING;
                const summary = userPrefs.map(p => `Q: ${p.question} A: ${p.answer}`).join('\n');
                await fetchAndShowSuggestions(summary);
            }
        }

        // LOGIC FIX: Immediate suggestions for Actor/Director queries
        async function generateImmediateRecommendations(userQuery) {
            addMessage('model', `Sure! Looking up movies matching "${userQuery}"...`);
            await fetchAndShowSuggestions(userQuery);
        }

        async function fetchAndShowSuggestions(preferencesContext) {
            const prompt = `
Based on: "${preferencesContext}"
Suggest 5 movies. Return JSON array: { "title": "Movie Title", "reason": "Short punchy reason" }
            `;
            const suggestions = await callGeminiJSON(prompt);
            if (!suggestions) return handleGeneralChat("I couldn't generate suggestions.");

            // Fetch details
            const moviePromises = suggestions.map(s => getSmartSearchTerm(s.title).then(cleanTitle => searchTMDB(cleanTitle)));
            const movieData = await Promise.all(moviePromises);
            
            const validMovies = movieData.map((m, i) => m ? { ...m, reason: suggestions[i].reason } : null).filter(Boolean);
            
            if (validMovies.length > 0) {
                renderCarousel(validMovies);
                chatHistory.push({ role: 'model', parts: [{ text: "Displayed suggestions." }] });
            } else {
                addMessage('model', "I couldn't find those movies in the database.");
            }
        }

        // --- SPECIFIC QUERY LOGIC (FIXED) ---
        async function handleSpecificQuery(entities, fullText) {
            // LOGIC FIX: Don't just search the first entity (which might be "transformer").
            // Use Gemini to get the EXACT search title first.
            const searchTerm = await getSmartSearchTerm(fullText);
            
            if (searchTerm) {
                const data = await searchTMDB(searchTerm);
                if (data) {
                    const details = await fetchTMDBDetails(data.id);
                    renderMovieCard(details);
                    
                    const contextPrompt = `User asked: "${fullText}". Movie: ${details.title}. Brief friendly answer.`;
                    const contextResponse = await callGeminiText(contextPrompt);
                    addMessage('model', contextResponse);
                } else {
                    handleGeneralChat(fullText);
                }
            } else {
                handleGeneralChat(fullText);
            }
        }

        // --- COMPARISON LOGIC (FIXED UI) ---
        async function handleComparison(entities) {
            if (entities.length < 2) return handleGeneralChat(`Compare ${entities[0] || 'movies'}...`);

            // Smart search for both
            const termA = await getSmartSearchTerm(entities[0]);
            const termB = await getSmartSearchTerm(entities[1]);
            
            const dataA = await searchTMDB(termA);
            const dataB = await searchTMDB(termB);

            if (!dataA || !dataB) {
                addMessage('model', "I couldn't find one of those movies to compare.");
                return;
            }

            const detailsA = await fetchTMDBDetails(dataA.id);
            const detailsB = await fetchTMDBDetails(dataB.id);

            const prompt = `
Compare ${detailsA.title} and ${detailsB.title}. 
Highlight differences in 2-3 sentences. Recommend one.
            `;
            const comparisonText = await callGeminiText(prompt);

            // UI FIX: Render text inside the comparison bubble
            renderComparison(detailsA, detailsB, comparisonText);
            chatHistory.push({ role: 'model', parts: [{ text: comparisonText }] });
        }

        async function handleRandomMovie() {
            const randomPage = Math.floor(Math.random() * 50) + 1;
            const url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&language=en-US&sort_by=popularity.desc&include_adult=false&page=${randomPage}&vote_average.gte=6`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.results?.length > 0) {
                const m = data.results[Math.floor(Math.random() * data.results.length)];
                const d = await fetchTMDBDetails(m.id);
                addMessage('model', "🎲 **Random Pick:**");
                renderMovieCard(d, "A random popular pick for you!");
            }
        }

        async function handleGeneralChat(text) {
            chatHistory.push({ role: 'user', parts: [{ text }] });
            const response = await callGeminiText(null, chatHistory);
            addMessage('model', response);
            chatHistory.push({ role: 'model', parts: [{ text: response }] });
        }

        // ==========================================
        // API HELPERS
        // ==========================================

        // LOGIC FIX: Smart Search Helper
        async function getSmartSearchTerm(userQuery) {
            const prompt = `
Extract the SINGLE most likely specific movie title to search for in TMDB from: "${userQuery}".
Examples:
"Most rated transformer movie" -> "Transformers"
"Best batman" -> "The Dark Knight"
"Miyazaki's spirited away" -> "Spirited Away"
Return ONLY the clean title string.
            `;
            const result = await callGeminiText(prompt);
            return result.replace(/["\n]/g, '').trim();
        }

        async function callGeminiJSON(prompt) {
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: "application/json" }
            };
            const res = await fetchGemini(payload);
            try { return JSON.parse(res); } catch(e) { return null; }
        }

        async function callGeminiText(prompt, history = []) {
            const contents = prompt ? [{ parts: [{ text: prompt }] }] : history;
            const tools = [{ google_search: {} }];
            return await fetchGemini({ contents, tools });
        }

        async function fetchGemini(payload) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GEMINI_API_KEY}`;
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Thinking error...";
            } catch (e) { return null; }
        }

        async function searchTMDB(query) {
            const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`;
            const res = await fetch(url);
            const data = await res.json();
            // Return first result that is actually a movie
            return data.results?.[0] || null;
        }

        async function fetchTMDBDetails(id) {
            const url = `https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}&append_to_response=credits,videos,release_dates`;
            const res = await fetch(url);
            return await res.json();
        }

        // ==========================================
        // UI RENDERERS
        // ==========================================

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'} fade-in-up`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] md:max-w-[70%] rounded-2xl p-4 shadow-lg text-sm md:text-base leading-relaxed ${
                role === 'user' 
                ? 'bg-white text-black rounded-tr-none' 
                : 'bg-white/10 backdrop-blur-md border border-white/10 text-gray-100 rounded-tl-none prose prose-invert'
            }`;
            
            bubble.innerHTML = marked.parse(content);
            div.appendChild(bubble);
            els.chatContainer.appendChild(div);
            scrollToBottom();
        }

        function renderMovieCard(movie, customReason = null) {
            const div = document.createElement('div');
            div.className = "flex justify-start w-full fade-in-up";
            
            const backdrop = movie.backdrop_path ? `https://image.tmdb.org/t/p/w780${movie.backdrop_path}` : null;
            const poster = movie.poster_path ? `https://image.tmdb.org/t/p/w342${movie.poster_path}` : 'https://placehold.co/300x450?text=No+Image';
            const year = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
            
            div.innerHTML = `
                <div class="w-full max-w-md bg-[#1a1a1a] border border-white/10 rounded-xl overflow-hidden shadow-2xl relative group">
                    ${backdrop ? `<div class="h-40 bg-cover bg-center relative" style="background-image: url('${backdrop}')">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#1a1a1a] to-transparent"></div>
                    </div>` : ''}
                    
                    <div class="p-5 ${backdrop ? '-mt-12' : ''} relative z-10 flex gap-4">
                        <img src="${poster}" class="w-24 h-36 rounded-lg shadow-lg object-cover flex-shrink-0 border border-white/20">
                        <div class="flex-1 min-w-0">
                            <h3 class="text-xl font-bold text-white truncate">${movie.title}</h3>
                            <div class="flex items-center gap-2 mt-1 text-xs text-gray-400">
                                <span class="text-yellow-400 font-bold">★ ${movie.vote_average.toFixed(1)}</span>
                                <span>${year}</span>
                            </div>
                            <div class="mt-3 flex gap-2">
                                <button onclick="openTrailer('${movie.id}')" class="bg-white text-black px-3 py-1.5 rounded text-xs font-bold hover:bg-gray-200 transition">Trailer</button>
                            </div>
                        </div>
                    </div>
                    <div class="px-5 pb-5 pt-0">
                        <p class="text-sm text-gray-300 line-clamp-3">${customReason || movie.overview}</p>
                    </div>
                </div>
            `;
            els.chatContainer.appendChild(div);
            scrollToBottom();
        }

        function renderCarousel(movies) {
            const container = document.createElement('div');
            container.className = "flex justify-start w-full fade-in-up my-2";
            const wrapper = document.createElement('div');
            wrapper.className = "w-full overflow-x-auto pb-4 flex gap-4 px-1 snap-x";
            
            movies.forEach(m => {
                const card = document.createElement('div');
                card.className = "snap-center flex-shrink-0 w-40 bg-[#1a1a1a] border border-white/10 rounded-lg overflow-hidden shadow-lg hover:scale-105 transition-transform duration-300 cursor-pointer";
                card.innerHTML = `
                    <div class="relative aspect-[2/3]">
                        <img src="https://image.tmdb.org/t/p/w342${m.poster_path}" class="w-full h-full object-cover">
                        <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black to-transparent p-2">
                            <span class="text-xs font-bold text-white">★ ${m.vote_average.toFixed(1)}</span>
                        </div>
                    </div>
                    <div class="p-2">
                        <h4 class="text-xs font-bold text-white truncate">${m.title}</h4>
                        <p class="text-[10px] text-gray-400 truncate">${m.release_date?.split('-')[0] || ''}</p>
                    </div>
                `;
                card.onclick = () => renderMovieCard(m, m.reason);
                wrapper.appendChild(card);
            });

            container.appendChild(wrapper);
            els.chatContainer.appendChild(container);
            scrollToBottom();
        }

        // UI FIX: comparisonText is now passed in and rendered INSIDE the bubble
        function renderComparison(m1, m2, comparisonText) {
            const container = document.createElement('div');
            container.className = "flex justify-start w-full fade-in-up my-2";
            
            const bubble = document.createElement('div');
            // Unified Bubble Style
            bubble.className = "w-full max-w-2xl bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl p-4 md:p-6 shadow-xl";

            // 1. The Grid of 2 Movies
            let html = `<div class="grid grid-cols-2 gap-4 mb-6">`;
            [m1, m2].forEach(m => {
                html += `
                    <div class="text-center group">
                        <div class="relative rounded-lg overflow-hidden shadow-lg mb-3">
                            <img src="https://image.tmdb.org/t/p/w342${m.poster_path}" class="w-full aspect-[2/3] object-cover">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <span class="text-white font-bold text-lg">★ ${m.vote_average.toFixed(1)}</span>
                            </div>
                        </div>
                        <h4 class="text-sm md:text-base font-bold text-white leading-tight">${m.title}</h4>
                        <p class="text-xs text-gray-400 mt-1">${m.release_date?.split('-')[0]}</p>
                    </div>
                `;
            });
            html += `</div>`;

            // 2. The Comparison Text (Inside the same bubble)
            html += `
                <div class="prose prose-invert prose-sm border-t border-white/10 pt-4 mt-2">
                    ${marked.parse(comparisonText)}
                </div>
            `;

            bubble.innerHTML = html;
            container.appendChild(bubble);
            els.chatContainer.appendChild(container);
            scrollToBottom();
        }

        function setLoading(isLoading) {
            if (isLoading) {
                const div = document.createElement('div');
                div.id = "loading-bubble";
                div.className = "flex justify-start fade-in-up";
                div.innerHTML = `
                    <div class="bg-white/10 backdrop-blur-md rounded-2xl px-4 py-3 flex items-center gap-2">
                        <span class="text-sm text-gray-300">Thinking</span>
                        <div class="elegant-spinner"></div>
                    </div>
                `;
                els.chatContainer.appendChild(div);
                currentLoadingEl = div;
                els.input.disabled = true;
            } else {
                if (currentLoadingEl) currentLoadingEl.remove();
                els.input.disabled = false;
                els.input.focus();
            }
            scrollToBottom();
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                els.mainScroll.scrollTop = els.mainScroll.scrollHeight;
            });
        }

        window.openTrailer = async (id) => {
            try {
                els.iframe.src = ""; 
                const data = await fetchTMDBDetails(id);
                const results = data.videos?.results || [];
                const trailer = results.find(v => v.site === 'YouTube' && v.type === 'Trailer') || results.find(v => v.site === 'YouTube');
                
                if (trailer) {
                    const origin = window.location.origin || ''; 
                    els.iframe.src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1&origin=${origin}`;
                    els.trailerModal.classList.add('open');
                } else {
                    alert("Sorry, no trailer found for this movie.");
                }
            } catch (e) { 
                alert("Unable to load trailer.");
            }
        };

        function closeModal() {
            els.trailerModal.classList.remove('open');
            els.iframe.src = "";
        }

        function setupCursor() {
            const dot = document.getElementById('cursor-dot');
            const follower = document.getElementById('cursor-follower');
            window.addEventListener('mousemove', (e) => {
                dot.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
                follower.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
            });
            document.querySelectorAll('a, button, input').forEach(el => {
                el.addEventListener('mouseenter', () => {
                    follower.style.width = '50px';
                    follower.style.height = '50px';
                    follower.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
                });
                el.addEventListener('mouseleave', () => {
                    follower.style.width = '30px';
                    follower.style.height = '30px';
                    follower.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
                });
            });
        }

        init();
    </script>
</body>
</html>
