<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let'sYap 2.0</title>
    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Lora:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    <!-- 3. Add marked.js library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* --- GLOBAL STYLES --- */
        body {
            font-family: 'Manrope', sans-serif;
            color: #ffffff;
            background-color: #0a0a0a;
            /* Dark overlay for better text contrast on the background image */
            background-color: rgba(0, 0, 0, 0.5); 
            background-blend-mode: overlay;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .font-serif-italic {
            font-family: 'Lora', serif;
            font-style: italic;
            font-weight: 700;
        }

        /* --- SCROLLBARS --- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* --- ANIMATIONS --- */
        .elegant-spinner {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CUSTOM CURSOR (Desktop Only) --- */
        @media (min-width: 769px) {
            body, a, button, input {
                cursor: none;
            }
            .cursor-dot, .cursor-follower {
                position: fixed;
                top: 0;
                left: 0;
                transform: translate(-50%, -50%);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                mix-blend-mode: exclusion;
                background-color: white;
            }
            .cursor-dot { width: 8px; height: 8px; }
            .cursor-follower { 
                width: 30px; height: 30px; 
                background-color: rgba(255,255,255,0.2);
                transition: width 0.2s, height 0.2s, transform 0.1s;
            }
        }
        @media (max-width: 768px) {
            .cursor-dot, .cursor-follower { display: none; }
        }

        /* --- MODAL --- */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal.open { opacity: 1; visibility: visible; }
        
        .modal-content {
            width: 90vw;
            max-width: 900px;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
    </style>
</head>
<body class="w-full min-h-screen overflow-hidden" style="background-image: url('https://framerusercontent.com/images/34O2HYfrgXuRFoJZrHtUPDH68bE.png?scale-down-to=2048&width=2912&height=1632'); background-size: cover; background-position: center center;">

    <!-- Custom Cursor -->
    <div id="cursor-dot" class="cursor-dot"></div>
    <div id="cursor-follower" class="cursor-follower"></div>

    <!-- App Container -->
    <div class="relative flex flex-col h-screen w-full max-w-5xl mx-auto">

        <!-- Header -->
        <header class="hidden md:flex justify-center items-center py-6 z-20">
            <h3 class="text-2xl font-extrabold tracking-tight">Let'sYap <span class="text-xs font-normal opacity-60 ml-1">v2.0</span></h3>
        </header>

        <!-- Main Chat Area -->
        <main id="main-scroll" class="flex-1 overflow-y-auto w-full px-4 md:px-6 pb-32 pt-12 md:pt-2 scroll-smooth">
            
            <!-- Welcome Screen -->
            <div id="initial-view" class="flex flex-col items-center justify-center h-full min-h-[60vh] text-center transition-all duration-500">
                <h1 class="text-5xl md:text-7xl font-extrabold text-white leading-tight tracking-tight drop-shadow-lg">
                    Discover your <br>
                    <span class="font-serif-italic text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">next favorite movie.</span>
                </h1>
                <p class="mt-6 text-lg text-gray-300 max-w-lg mx-auto">
                    Powered by Gemini 2.5 Pro & TMDB. <br> Compare films, find hidden gems, or get personalized picks.
                </p>
                
                <!-- Quick Action Chips -->
                <div class="mt-8 flex flex-wrap gap-3 justify-center">
                    <button class="suggestion-chip px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/10 rounded-full text-sm backdrop-blur-md transition-all">Suggest a random movie</button>
                    <button class="suggestion-chip px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/10 rounded-full text-sm backdrop-blur-md transition-all">Compare Inception vs Interstellar</button>
                    <button class="suggestion-chip px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/10 rounded-full text-sm backdrop-blur-md transition-all">Find me a Sci-Fi movie</button>
                </div>
            </div>

            <!-- Chat Container -->
            <div id="chat-container" class="w-full space-y-6 max-w-3xl mx-auto"></div>

        </main>

        <!-- Footer / Input Area -->
        <footer class="w-full p-4 z-30">
            <div class="w-full max-w-3xl mx-auto relative">
                <!-- Input Box -->
                <div class="bg-black/40 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl flex items-center p-2 transition-all focus-within:border-white/30 focus-within:bg-black/60">
                    <input type="text" id="user-input" 
                        class="flex-1 bg-transparent text-white placeholder-gray-400 px-4 py-3 outline-none text-base min-w-0" 
                        autocomplete="off"
                        placeholder="Ask for a recommendation, comparison, or movie info...">
                    
                    <button id="send-button" class="bg-white text-black hover:bg-gray-200 p-3 rounded-xl font-bold transition-colors flex items-center justify-center group disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 group-hover:translate-x-0.5 transition-transform">
                            <path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z" />
                        </svg>
                    </button>
                </div>
                <div class="text-center mt-2">
                    <p class="text-[10px] text-gray-500">Powered by Google Gemini 2.5 Pro</p>
                </div>
            </div>
        </footer>
    </div>

    <!-- Video Modal -->
    <div id="trailer-modal" class="modal">
        <div class="modal-content">
            <button id="close-modal" class="absolute top-4 right-4 z-50 bg-black/50 hover:bg-black/80 text-white rounded-full w-10 h-10 flex items-center justify-center text-2xl backdrop-blur-sm">&times;</button>
            <div class="video-wrapper">
                <!-- Updated Iframe with full permissions -->
                <iframe id="trailer-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        // ==========================================
        // CONFIGURATION & API KEYS
        // ==========================================
        // REPLACE THESE WITH YOUR ACTUAL KEYS
        const GEMINI_API_KEY = "AIzaSyA_TYda0KfNRZ55ZwI18NmKc3mBeDDiHio"; 
        const TMDB_API_KEY = "6c39d6b4242edaf0a6e6f9e4b56eda66"; 

        // ==========================================
        // STATE MANAGEMENT
        // ==========================================
        const STATE = {
            IDLE: 'IDLE',
            ASKING_PREFS: 'ASKING_PREFS',
            CHATTING: 'CHATTING'
        };

        let currentState = STATE.IDLE;
        let chatHistory = [];
        let userPrefs = [];
        let prefQuestions = [];
        let currentQuestionIndex = 0;
        let currentLoadingEl = null;

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const els = {
            mainScroll: document.getElementById('main-scroll'),
            initialView: document.getElementById('initial-view'),
            chatContainer: document.getElementById('chat-container'),
            input: document.getElementById('user-input'),
            sendBtn: document.getElementById('send-button'),
            trailerModal: document.getElementById('trailer-modal'),
            closeModal: document.getElementById('close-modal'),
            iframe: document.getElementById('trailer-iframe'),
            chips: document.querySelectorAll('.suggestion-chip')
        };

        // ==========================================
        // INITIALIZATION & EVENTS
        // ==========================================
        function init() {
            // Check Keys
            if (GEMINI_API_KEY.includes("YOUR_GEMINI") || TMDB_API_KEY.includes("YOUR_TMDB")) {
                addMessage('model', "⚠️ **API Keys Missing.** Please open the code file and replace `YOUR_GEMINI_API_KEY_HERE` and `YOUR_TMDB_API_KEY_HERE` with valid keys.");
                return;
            }

            // System Prompt setup
            const systemPrompt = `
You are Let'sYap, an intelligent AI movie recommender powered by Gemini 2.5 Pro.
Your goal is to help users find movies.
1. **Understand Intent**:
   - COMPARE: Compare two movies.
   - RANDOM: Suggest one random movie instantly.
   - RECOMMEND: User wants suggestions based on taste. Ask EXACTLY 3 questions.
   - SPECIFIC: Info about a specific movie/actor.
2. **Tone**: Friendly, engaging, concise.
3. **Output**: Markdown supported.
            `;
            chatHistory.push({ role: 'user', parts: [{ text: systemPrompt }] });
            chatHistory.push({ role: 'model', parts: [{ text: "Understood. I am ready." }] });

            // Event Listeners
            els.sendBtn.addEventListener('click', handleSend);
            els.input.addEventListener('keypress', (e) => e.key === 'Enter' && handleSend());
            
            // Modal Events
            els.closeModal.addEventListener('click', closeModal);
            els.trailerModal.addEventListener('click', (e) => e.target === els.trailerModal && closeModal());
            document.addEventListener('keydown', (e) => e.key === 'Escape' && closeModal());

            // Chip Events
            els.chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    els.input.value = chip.textContent;
                    handleSend();
                });
            });

            // Cursor Logic (Desktop)
            setupCursor();
        }

        // ==========================================
        // CORE LOGIC FLOW
        // ==========================================
        async function handleSend() {
            const text = els.input.value.trim();
            if (!text) return;

            // UI Updates
            els.input.value = '';
            els.initialView.style.display = 'none'; // Hide welcome screen
            addMessage('user', text);
            setLoading(true);

            try {
                // FLOW CONTROL BASED ON STATE
                if (currentState === STATE.ASKING_PREFS) {
                    await handlePreferenceAnswer(text);
                } else {
                    // Determine Intent for new queries
                    const analysis = await classifyIntent(text);
                    console.log("Intent Analysis:", analysis);

                    switch (analysis.intent) {
                        case 'COMPARE':
                            await handleComparison(analysis.entities);
                            break;
                        case 'RANDOM':
                            await handleRandomMovie();
                            break;
                        case 'RECOMMEND':
                            await startRecommendationFlow();
                            break;
                        case 'SPECIFIC':
                            await handleSpecificQuery(analysis.entities, text);
                            break;
                        default: // CHAT
                            await handleGeneralChat(text);
                            break;
                    }
                }
            } catch (error) {
                console.error(error);
                addMessage('model', "Sorry, I encountered an error. Please try again.");
            } finally {
                setLoading(false);
            }
        }

        // ==========================================
        // HANDLERS
        // ==========================================

        // --- 1. INTENT CLASSIFICATION ---
        async function classifyIntent(userText) {
            const prompt = `
Analyze this user text: "${userText}".
Classify into one of these intents:
- COMPARE: asking to compare 2+ specific movies.
- RANDOM: asking for a random suggestion, "pick for me", "surprise me".
- RECOMMEND: asking for suggestions generally ("find me a movie", "good horror movies").
- SPECIFIC: asking about a specific movie/actor/director details.
- CHAT: general conversation.

Extract entities (movie titles, names).
Return JSON: { "intent": "STRING", "entities": ["String"] }
            `;
            const response = await callGeminiJSON(prompt);
            return response || { intent: 'CHAT', entities: [] };
        }

        // --- 2. RECOMMENDATION FLOW (3 Questions) ---
        async function startRecommendationFlow() {
            currentState = STATE.ASKING_PREFS;
            userPrefs = [];
            currentQuestionIndex = 0;

            // Generate 3 targeted questions
            const prompt = "Generate exactly 3 short, engaging questions to understand a user's movie taste. Return JSON array of strings.";
            prefQuestions = await callGeminiJSON(prompt);
            
            if (!prefQuestions || prefQuestions.length !== 3) {
                prefQuestions = [
                    "What genre are you in the mood for today?",
                    "Do you prefer something classic or a modern release?",
                    "Name a movie you watched recently and loved."
                ];
            }

            addMessage('model', "Great! I'll find the perfect movie for you. First, " + prefQuestions[0]);
            chatHistory.push({ role: 'model', parts: [{ text: prefQuestions[0] }] });
        }

        async function handlePreferenceAnswer(answer) {
            userPrefs.push({ question: prefQuestions[currentQuestionIndex], answer: answer });
            chatHistory.push({ role: 'user', parts: [{ text: answer }] });
            
            currentQuestionIndex++;

            if (currentQuestionIndex < 3) {
                const nextQ = prefQuestions[currentQuestionIndex];
                addMessage('model', nextQ);
                chatHistory.push({ role: 'model', parts: [{ text: nextQ }] });
            } else {
                // Finish Flow
                addMessage('model', "Thanks! Analyzing your taste...");
                currentState = STATE.CHATTING; // Reset state
                await generateRecommendations();
            }
        }

        async function generateRecommendations() {
            const prefSummary = userPrefs.map(p => `Q: ${p.question} A: ${p.answer}`).join('\n');
            const prompt = `
Based on these preferences:
${prefSummary}

Suggest 5 movies. Return JSON array of objects: { "title": "Movie Title", "reason": "Short punchy reason" }
            `;
            
            const suggestions = await callGeminiJSON(prompt);
            if (!suggestions) return handleGeneralChat("I couldn't generate suggestions.");

            addMessage('model', "Here are 5 movies tailored just for you:");
            
            // Fetch details and show carousel
            const moviePromises = suggestions.map(s => searchTMDB(s.title));
            const movieData = await Promise.all(moviePromises);
            
            // Merge reason into movie data
            const validMovies = movieData.map((m, i) => m ? { ...m, reason: suggestions[i].reason } : null).filter(Boolean);
            
            renderCarousel(validMovies);
            chatHistory.push({ role: 'model', parts: [{ text: "Provided movie suggestions." }] });
        }

        // --- 3. RANDOM MOVIE ---
        async function handleRandomMovie() {
            // Fetch a random page of popular movies
            const randomPage = Math.floor(Math.random() * 50) + 1;
            const url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&language=en-US&sort_by=popularity.desc&include_adult=false&page=${randomPage}&vote_average.gte=6`;
            
            const res = await fetch(url);
            const data = await res.json();
            
            if (data.results && data.results.length > 0) {
                const randomMovie = data.results[Math.floor(Math.random() * data.results.length)];
                const details = await fetchTMDBDetails(randomMovie.id);
                
                addMessage('model', "🎲 **Random Pick:**");
                renderMovieCard(details, "A random selection from highly-rated popular movies.");
                chatHistory.push({ role: 'model', parts: [{ text: `Suggested random movie: ${details.title}` }] });
            } else {
                addMessage('model', "Couldn't find a random movie right now.");
            }
        }

        // --- 4. COMPARISON ---
        async function handleComparison(entities) {
            if (entities.length < 2) {
                return handleGeneralChat(`Compare ${entities[0] || 'movies'}...`);
            }

            const [movieA, movieB] = entities;
            const dataA = await searchTMDB(movieA);
            const dataB = await searchTMDB(movieB);

            if (!dataA || !dataB) {
                addMessage('model', "I couldn't find details for one or both of those movies to compare.");
                return;
            }

            // Get full details
            const detailsA = await fetchTMDBDetails(dataA.id);
            const detailsB = await fetchTMDBDetails(dataB.id);

            // Ask Gemini to compare
            const prompt = `
Compare these two movies based on the data below. Highlight key differences in tone, style, and themes. Recommend one based on general appeal.
Movie A: ${JSON.stringify(detailsA)}
Movie B: ${JSON.stringify(detailsB)}
            `;
            const comparisonText = await callGeminiText(prompt);

            // Render Side-by-Side
            renderComparison(detailsA, detailsB);
            addMessage('model', comparisonText);
            chatHistory.push({ role: 'model', parts: [{ text: comparisonText }] });
        }

        // --- 5. SPECIFIC QUERY ---
        async function handleSpecificQuery(entities, fullText) {
            if (entities.length > 0) {
                const movieName = entities[0];
                const data = await searchTMDB(movieName);
                
                if (data) {
                    const details = await fetchTMDBDetails(data.id);
                    renderMovieCard(details);
                    // Provide additional context from Gemini
                    const contextPrompt = `The user asked: "${fullText}". The movie is ${details.title}. Provide a brief, friendly answer addressing their specific question.`;
                    const contextResponse = await callGeminiText(contextPrompt);
                    addMessage('model', contextResponse);
                } else {
                    handleGeneralChat(fullText);
                }
            } else {
                handleGeneralChat(fullText);
            }
        }

        // --- 6. GENERAL CHAT ---
        async function handleGeneralChat(text) {
            chatHistory.push({ role: 'user', parts: [{ text }] });
            const response = await callGeminiText(null, chatHistory); // Uses history
            addMessage('model', response);
            chatHistory.push({ role: 'model', parts: [{ text: response }] });
        }

        // ==========================================
        // API HELPERS
        // ==========================================

        async function callGeminiJSON(prompt) {
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: "application/json" }
            };
            const result = await fetchGemini(payload);
            return result ? JSON.parse(result) : null;
        }

        async function callGeminiText(prompt, history = []) {
            const contents = prompt ? [{ parts: [{ text: prompt }] }] : history;
            
            // Enable Google Search Tool for grounding if available in this environment
            const tools = [{ google_search: {} }];

            const payload = {
                contents: contents,
                tools: tools
            };
            return await fetchGemini(payload);
        }

        async function fetchGemini(payload) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GEMINI_API_KEY}`;
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "I'm having trouble thinking right now.";
            } catch (e) {
                console.error("Gemini API Error:", e);
                return null;
            }
        }

        async function searchTMDB(query) {
            const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`;
            const res = await fetch(url);
            const data = await res.json();
            return data.results?.[0] || null;
        }

        async function fetchTMDBDetails(id) {
            const url = `https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}&append_to_response=credits,videos,release_dates`;
            const res = await fetch(url);
            return await res.json();
        }

        // ==========================================
        // UI RENDERERS
        // ==========================================

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'} fade-in-up`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] md:max-w-[70%] rounded-2xl p-4 shadow-lg text-sm md:text-base leading-relaxed ${
                role === 'user' 
                ? 'bg-white text-black rounded-tr-none' 
                : 'bg-white/10 backdrop-blur-md border border-white/10 text-gray-100 rounded-tl-none prose prose-invert'
            }`;
            
            bubble.innerHTML = marked.parse(content);
            div.appendChild(bubble);
            els.chatContainer.appendChild(div);
            scrollToBottom();
        }

        function renderMovieCard(movie, customReason = null) {
            const div = document.createElement('div');
            div.className = "flex justify-start w-full fade-in-up";
            
            const backdrop = movie.backdrop_path ? `https://image.tmdb.org/t/p/w780${movie.backdrop_path}` : null;
            const poster = movie.poster_path ? `https://image.tmdb.org/t/p/w342${movie.poster_path}` : 'https://placehold.co/300x450?text=No+Image';
            const year = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
            const director = movie.credits?.crew?.find(c => c.job === 'Director')?.name || 'Unknown';
            
            div.innerHTML = `
                <div class="w-full max-w-md bg-[#1a1a1a] border border-white/10 rounded-xl overflow-hidden shadow-2xl relative group">
                    ${backdrop ? `<div class="h-40 bg-cover bg-center relative" style="background-image: url('${backdrop}')">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#1a1a1a] to-transparent"></div>
                    </div>` : ''}
                    
                    <div class="p-5 ${backdrop ? '-mt-12' : ''} relative z-10 flex gap-4">
                        <img src="${poster}" class="w-24 h-36 rounded-lg shadow-lg object-cover flex-shrink-0 border border-white/20">
                        <div class="flex-1 min-w-0">
                            <h3 class="text-xl font-bold text-white truncate leading-tight">${movie.title}</h3>
                            <div class="flex items-center gap-2 mt-1 text-xs text-gray-400">
                                <span class="bg-yellow-500/20 text-yellow-400 px-1.5 py-0.5 rounded border border-yellow-500/30">${movie.vote_average.toFixed(1)} ★</span>
                                <span>${year}</span>
                                <span>${movie.runtime}m</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-1 truncate">Dir. ${director}</p>
                            <div class="mt-3 flex gap-2">
                                <button onclick="openTrailer('${movie.id}')" class="bg-white text-black px-3 py-1.5 rounded text-xs font-bold hover:bg-gray-200 transition">Trailer</button>
                                <button class="border border-white/20 text-white px-3 py-1.5 rounded text-xs hover:bg-white/10 transition">Details</button>
                            </div>
                        </div>
                    </div>
                    
                    ${customReason ? `<div class="px-5 pb-5 pt-0"><p class="text-sm text-gray-300 italic border-l-2 border-purple-500 pl-3">"${customReason}"</p></div>` : `
                    <div class="px-5 pb-5 pt-0">
                        <p class="text-sm text-gray-300 line-clamp-3">${movie.overview}</p>
                    </div>`}
                </div>
            `;
            els.chatContainer.appendChild(div);
            scrollToBottom();
        }

        function renderCarousel(movies) {
            const container = document.createElement('div');
            container.className = "flex justify-start w-full fade-in-up my-2";
            
            const wrapper = document.createElement('div');
            wrapper.className = "w-full overflow-x-auto pb-4 flex gap-4 px-1 snap-x";
            
            movies.forEach(m => {
                const card = document.createElement('div');
                card.className = "snap-center flex-shrink-0 w-40 bg-[#1a1a1a] border border-white/10 rounded-lg overflow-hidden shadow-lg hover:scale-105 transition-transform duration-300 cursor-pointer";
                card.innerHTML = `
                    <div class="relative aspect-[2/3]">
                        <img src="https://image.tmdb.org/t/p/w342${m.poster_path}" class="w-full h-full object-cover">
                        <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black to-transparent p-2">
                            <span class="text-xs font-bold text-white">${m.vote_average.toFixed(1)} ★</span>
                        </div>
                    </div>
                    <div class="p-2">
                        <h4 class="text-xs font-bold text-white truncate">${m.title}</h4>
                        <p class="text-[10px] text-gray-400 truncate">${m.release_date?.split('-')[0] || ''}</p>
                    </div>
                `;
                card.onclick = () => renderMovieCard(m, m.reason);
                wrapper.appendChild(card);
            });

            container.appendChild(wrapper);
            els.chatContainer.appendChild(container);
            scrollToBottom();
        }

        function renderComparison(m1, m2) {
            const container = document.createElement('div');
            container.className = "flex justify-start w-full fade-in-up my-2";
            
            const wrapper = document.createElement('div');
            wrapper.className = "w-full grid grid-cols-2 gap-2 md:gap-4 bg-white/5 p-3 rounded-xl border border-white/10";

            [m1, m2].forEach(m => {
                wrapper.innerHTML += `
                    <div class="text-center">
                        <img src="https://image.tmdb.org/t/p/w185${m.poster_path}" class="w-24 h-36 md:w-32 md:h-48 object-cover rounded-lg mx-auto shadow-md mb-2">
                        <h4 class="text-sm font-bold text-white">${m.title}</h4>
                        <p class="text-xs text-yellow-400">${m.vote_average.toFixed(1)} ★</p>
                        <p class="text-xs text-gray-400 mt-1 line-clamp-2">${m.genres.map(g=>g.name).slice(0,2).join(', ')}</p>
                    </div>
                `;
            });

            container.appendChild(wrapper);
            els.chatContainer.appendChild(container);
            scrollToBottom();
        }

        function setLoading(isLoading) {
            if (isLoading) {
                const div = document.createElement('div');
                div.id = "loading-bubble";
                div.className = "flex justify-start fade-in-up";
                div.innerHTML = `
                    <div class="bg-white/10 backdrop-blur-md rounded-2xl px-4 py-3 flex items-center gap-2">
                        <span class="text-sm text-gray-300">Thinking</span>
                        <div class="elegant-spinner"></div>
                    </div>
                `;
                els.chatContainer.appendChild(div);
                currentLoadingEl = div;
                els.input.disabled = true;
            } else {
                if (currentLoadingEl) currentLoadingEl.remove();
                els.input.disabled = false;
                els.input.focus();
            }
            scrollToBottom();
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                els.mainScroll.scrollTop = els.mainScroll.scrollHeight;
            });
        }

        // ==========================================
        // GLOBAL HELPERS (Exposed to window)
        // ==========================================
        window.openTrailer = async (id) => {
            try {
                // 1. Reset src to ensure player refreshes
                els.iframe.src = ""; 

                // 2. Fetch details
                const data = await fetchTMDBDetails(id);
                
                // 3. Find the best YouTube trailer
                const results = data.videos?.results || [];
                const trailer = results.find(v => v.site === 'YouTube' && v.type === 'Trailer') || results.find(v => v.site === 'YouTube');
                
                if (trailer) {
                    // 4. Construct robust URL with origin to prevent blocking
                    // 'origin' helps when running in restricted environments
                    const origin = window.location.origin || ''; 
                    els.iframe.src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1&origin=${origin}`;
                    els.trailerModal.classList.add('open');
                } else {
                    alert("Sorry, no trailer found for this movie.");
                }
            } catch (e) { 
                console.error("Trailer Error:", e);
                // Fallback alert if something strictly fails
                alert("Unable to load trailer. Please check your network or API Key.");
            }
        };

        function closeModal() {
            els.trailerModal.classList.remove('open');
            els.iframe.src = "";
        }

        function setupCursor() {
            const dot = document.getElementById('cursor-dot');
            const follower = document.getElementById('cursor-follower');
            
            window.addEventListener('mousemove', (e) => {
                dot.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
                follower.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
            });

            document.querySelectorAll('a, button, input').forEach(el => {
                el.addEventListener('mouseenter', () => {
                    follower.style.width = '50px';
                    follower.style.height = '50px';
                    follower.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
                });
                el.addEventListener('mouseleave', () => {
                    follower.style.width = '30px';
                    follower.style.height = '30px';
                    follower.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
                });
            });
        }

        // Start App
        init();
    </script>
</body>
</html>
