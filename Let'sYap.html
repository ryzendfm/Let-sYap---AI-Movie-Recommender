<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let'sYap</title>
    <!-- 1. Load Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Load Google Fonts (Manrope for sans-serif, Lora for serif-italic) --><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Lora:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    <!-- 3. Add marked.js library --><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* 3. Set default font and custom styles */
        body {
            font-family: 'Manrope', sans-serif;
            color: #ffffff;
            background-color: #0a0a0a; /* Base background */
            /* Add a subtle overlay to the background image for text contrast */
            background-blend-mode: multiply;
            background-color: rgba(0, 0, 0, 0.3);
            
            /* NEW: Ensure full height for flex layout */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Custom class for the special italic font */
        .font-serif-italic {
            font-family: 'Lora', serif;
            font-style: italic;
            font-weight: 700; /* Lora's italic often looks best bold */
        }

        /* --- Custom scrollbar for main page --- */
        body::-webkit-scrollbar {
            width: 8px;
        }
        body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 4px;
        }
        body::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        /* --- UPDATED: Custom scrollbar for the chat window (now main) --- */
        /* This now applies to the <main> element */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1); /* Match body */
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4); /* Match body */
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.6); /* Match body */
        }
        
        /* NEW: Horizontal Scrollbar for carousels */
        .horizontal-scrollbar::-webkit-scrollbar {
            height: 4px;
        }
        .horizontal-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        .horizontal-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 2px;
        }
        .horizontal-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.6);
        }


        /* --- NEW: Elegant spinner animation --- */
        .elegant-spinner {
            width: 20px; /* Size of the spinner */
            height: 20px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2); /* Light grey track */
            border-top-color: #ffffff; /* White loading part */
            animation: spin 1s linear infinite;
            margin-left: 12px; /* Add some space from the text */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- NEW: Custom Cursor --- */
        /* MODIFIED: Default cursor is back for mobile-first */
        body, a, button, label[for], input[type=radio] {
            /* cursor: none; <-- REMOVED */
            cursor: default; /* Use system cursor */
        }

        .cursor-dot,
        .cursor-follower {
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            background-color: #ffffff;
            transition: width 0.2s ease-out, height 0.2s ease-out; 
        }

        .cursor-dot {
            width: 8px;
            height: 8px;
        }

        .cursor-follower {
            width: 30px;
            height: 30px;
            filter: saturate(0);
            transition: transform 0.15s ease-out, width 0.2s ease-out, height 0.2s ease-out;
        }
        
        /* NEW: Hide custom cursor on mobile devices */
        @media (max-width: 768px) {
            .cursor-dot,
            .cursor-follower {
                display: none;
            }
            /* Restore default cursor behavior on mobile */
            body, a, button, label[for], input[type=radio] {
                cursor: default;
            }
        }


        /* --- NEW: Modal Styles --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }

        .modal.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: #1a1a1a;
            padding: 0;
            border-radius: 10px;
            width: 90vw; 
            max-width: 900px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .modal-close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            font-size: 24px;
            color: #ffffff;
            cursor: pointer;
            z-index: 10001; /* Ensure it's above the iframe */
            border-radius: 50%;
            width: 32px;
            height: 32px;
            line-height: 32px;
            text-align: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

    </style>
</head>

        <!-- 
            Chat Input Bar

    </div>

        <div class="modal-content">

        <div id="trailer-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

    <script type="module">
        // --- API KEYS ---
        // --- IMPORTANT: YOU MUST REPLACE THESE KEYS! ---
        // The app will not work without valid API keys.
        // 1. Get your Gemini Key: https://aistudio.google.com/app/apikey
        // 2. Get your TMDB Key: https://www.themoviedb.org/settings/api (Use the v3 key)
        
        const GEMINI_API_KEY = "AIzaSyA_TYda0KfNRZ55ZwI18NmKc3mBeDDiHio";
        const TMDB_API_KEY = "6c39d6b4242edaf0a6e6f9e4b56eda66";
        
        // --- CHATBOT STATE ---
        const questions = [ // Fallback questions
            "What's your favorite movie genre (e.g., Sci-Fi, Comedy, Drama)?",
            "What's a movie you recently watched and loved?",
            "What are you in the mood for? Something light-hearted, intense, or thought-provoking?",
            "Do you prefer newer releases or classic films?",
            "Is there any actor or director you're a big fan of?"
        ];
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let chatHistory = []; // For follow-up conversation
        let currentLoadingEl = null; // NEW: To track the loading bubble
        let suggestedMovies = []; // NEW: To store suggested movie data
        let dynamicQuestions = []; // NEW: To store dynamically generated questions

        // --- DOM ELEMENTS ---
        const mainScrollArea = document.querySelector('main'); // NEW
        const initialView = document.getElementById('initial-view');
        // const chatView = document.getElementById('chat-view'); // REMOVED
        const chatContainer = document.getElementById('chat-container'); // NEW
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const footerCredits = document.getElementById('footer-credits'); // NEW
        
        // --- NEW: MODAL DOM ELEMENTS ---
        const trailerModal = document.getElementById('trailer-modal');
        const closeModalButton = document.getElementById('close-modal');
        const trailerIframe = document.getElementById('trailer-iframe');

        // --- EVENT LISTENERS ---
        sendButton.addEventListener('click', handleUserResponse);
        userInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                handleUserResponse();
            }
        });

        // --- NEW: MODAL EVENT LISTENERS ---
        closeModalButton.addEventListener('click', closeTrailerModal);
        trailerModal.addEventListener('click', (e) => {
            if (e.target === trailerModal) { // Close if clicking outside the content
                closeTrailerModal();
            }
        });
        document.addEventListener('keydown', (e) => { // Close with Escape key
            if (e.key === 'Escape' && trailerModal.classList.contains('open')) {
                closeTrailerModal();
            }
        });


        // --- NEW: CUSTOM CURSOR LOGIC ---
        const cursorDotEl = document.getElementById('cursor-dot');
        const cursorFollowerEl = document.getElementById('cursor-follower');

        // Only run custom cursor logic if not on a touch device (basic check)
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        
        if (!isTouchDevice) {
            // Restore cursor:none behavior for desktop
            document.body.style.cursor = 'none';
            const interactiveElements = document.querySelectorAll('a, button, label[for], input, textarea');
            interactiveElements.forEach(el => el.style.cursor = 'none');


            window.addEventListener('mousemove', (e) => {
                // No transition on dot, so just set its transform
                cursorDotEl.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
                
                // Follower has transition, so this works perfectly
                cursorFollowerEl.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
            });

            // Add hover effects for interactive elements
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    cursorFollowerEl.style.width = '45px';
                    cursorFollowerEl.style.height = '45px';
                });
                el.addEventListener('mouseleave', () => {
                    cursorFollowerEl.style.width = '30px';
                    cursorFollowerEl.style.height = '30px';
                });
            });
        }
        
        // --- END CUSTOM CURSOR LOGIC ---

        // --- NEW HELPER FOR CARD CLICKS ---
        async function showMovieCardDetails(movieId) {
            setLoading(true);
            try {
                const movieDetails = await fetchMovieDetailsFromTMDB(movieId);
                if (movieDetails) {
                    displayMovieDetails(movieDetails);
                    chatHistory.push({ role: 'model', parts: [{ text: `Here are details on ${movieDetails.title}.` }] });
                } else {
                    displayMessage("Sorry, I couldn't fetch the details for that movie.", 'model');
                }
            } catch (error) {
                console.error("Error fetching movie details from card click:", error);
                displayMessage("Sorry, I ran into an error trying to get those details.", 'model');
            } finally {
                setLoading(false);
            }
        }


        // --- INITIALIZATION ---
        function init() {
            // System instruction to prime the chat
            chatHistory.push({
                role: 'user',
                parts: [{ text: "You are Let'sYap, a helpful chatbot that asks questions to learn a user's movie taste and then suggests 5 movies. After suggesting movies, you can answer follow-up questions about movies." }]
            });
             chatHistory.push({
                role: 'model',
                parts: [{ text: "I understand. I am Let'sYap. I will guide the user through questions, provide suggestions, and then be ready for further movie discussion." }]
            });
            userInput.focus();
        }

        // --- CORE CHAT LOGIC ---
        async function handleUserResponse() {
            // --- NEW: API KEY CHECK ---
            if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE" || TMDB_API_KEY === "YOUR_TMDB_API_KEY_HERE") {
                displayMessage("<strong>Error: API Key Missing!</strong><br>Please open the `index.html` file (lines 332-333) and replace the placeholder API keys (`YOUR_GEMINI_API_KEY_HERE` and `YOUR_TMDB_API_KEY_HERE`) with your own valid keys to use the app.", 'model');
                userInput.value = ''; // Clear input just in case
                return; // Stop execution if keys are missing
            }
            // --- END NEW CHECK ---

            const text = userInput.value.trim();
            if (text === '') return;

            userInput.value = '';
            // setLoading(true); // <-- MOVED to be more granular

            // --- Schemas defined once for reuse ---
            const movieTitleExtractionInstruction = {
                parts: [{ text: "You are a query analyzer. Analyze the user's last message. If they seem to be asking for details about a *specific movie title*, extract that title. If it's just general chat, return an empty string for the title." }]
            };
            const movieTitleExtractionSchema = {
                type: "OBJECT",
                properties: { "movieTitle": { "type": "STRING" } },
                required: ["movieTitle"]
            };

            try {
                // --- 1. NEW: First Message / Pre-Suggestion Phase ---
                if (currentQuestionIndex === 0) { 
                    
                    // Hide initial UI elements
                    initialView.classList.add('opacity-0', 'h-0', 'hidden');
                    footerCredits.classList.add('opacity-0', 'hidden');

                    displayMessage(text, 'user'); // <-- Step 1: Display user message
                    setLoading(true); // <-- Step 2: Show "Thinking"
                    chatHistory.push({ role: 'user', parts: [{ text }] });

                    // --- NEW LOGIC: Check for specific movie title FIRST ---
                    const titleAnalysis = await callGeminiAPI(chatHistory, movieTitleExtractionInstruction, movieTitleExtractionSchema);

                    if (titleAnalysis && titleAnalysis.movieTitle && titleAnalysis.movieTitle.trim() !== "") {
                        // --- 1A. User asked for a specific movie ---
                        await searchAndDisplayMovie(titleAnalysis.movieTitle);
                        // CRITICAL: Set index to "follow-up" phase
                        currentQuestionIndex = (dynamicQuestions.length || questions.length) + 1; 
                        userInput.placeholder = "Ask me about another movie!";

                    } else {
                        // --- 1B. No specific movie found, check for generic suggestion intent ---
                        const intentAnalysisInstruction = {
                            parts: [{ text: "You are an intent classifier. Analyze the user's last message. Determine if they are asking for a movie, anime, or show suggestion (e.g., 'suggest a movie', 'I want to watch something', 'find me an anime', 'any good Tamil movies?')." }]
                        };
                        const intentAnalysisSchema = {
                            type: "OBJECT",
                            properties: { "wantsSuggestion": { "type": "BOOLEAN" } },
                            required: ["wantsSuggestion"]
                        };

                        const analysis = await callGeminiAPI(chatHistory, intentAnalysisInstruction, intentAnalysisSchema);

                        if (analysis && analysis.wantsSuggestion) {
                            // --- 1B-i. User wants a suggestion ---
                            const introMessage = "Great! Let's get started. I'll ask you a few questions to understand your movie preferences.";
                            displayMessage(introMessage, 'model');
                            chatHistory.push({ role: 'model', parts: [{ text: introMessage }] });

                            await generateDynamicQuestions(); 
                            
                            if (dynamicQuestions.length > 0) {
                                const firstQuestion = dynamicQuestions[currentQuestionIndex];
                                displayMessage(firstQuestion, 'model');
                                chatHistory.push({ role: 'model', parts: [{ text: firstQuestion }] });
                                currentQuestionIndex++; // <-- This is the crucial step
                                userInput.placeholder = "Type your answer..."; 
                            } else {
                                // Fallback
                                displayMessage("It looks like I'm having trouble coming up with new questions right now. Let's use some standard ones.", 'model');
                                dynamicQuestions = [...questions];
                                const firstQuestion = dynamicQuestions[currentQuestionIndex];
                                displayMessage(firstQuestion, 'model');
                                chatHistory.push({ role: 'model', parts: [{ text: firstQuestion }] });
                                currentQuestionIndex++; // <-- Also crucial here
                                userInput.placeholder = "Type your answer..."; 
                            }
                        } else {
                            // --- 1B-ii. User is just chatting ---
                            // currentQuestionIndex stays 0
                            const modelResponse = await callGeminiAPI(chatHistory); 
                            displayMessage(modelResponse, 'model');
                            chatHistory.push({ role: 'model', parts: [{ text: modelResponse }] });
                            userInput.placeholder = "Ask me for a movie suggestion!"; // Guide the user
                        }
                    }

                } else if (currentQuestionIndex > 0 && currentQuestionIndex <= dynamicQuestions.length) {
                    // --- 2. Answering Questions Phase (Unchanged) ---
                    displayMessage(text, 'user'); // <-- Step 1
                    setLoading(true); // <-- Step 2
                    userAnswers.push(text);
                    chatHistory.push({ role: 'user', parts: [{ text }] });

                    if (currentQuestionIndex < dynamicQuestions.length) {
                        // Ask the next question
                        const nextQuestion = dynamicQuestions[currentQuestionIndex];
                        displayMessage(nextQuestion, 'model');
                        chatHistory.push({ role: 'model', parts: [{ text: nextQuestion }] });
                        currentQuestionIndex++;
                    } else {
                        // All questions answered, time to get movies
                        displayMessage("Fantastic! Based on your answers, I'm finding some movies you might like...", 'model');
                        currentQuestionIndex++; // Move past question phase
                        await generateMovieSuggestions();
                    }
                } else if (currentQuestionIndex > dynamicQuestions.length) {
                    // --- 3. Follow-up Chat Phase ---
                    displayMessage(text, 'user'); // <-- Step 1
                    setLoading(true); // <-- Step 2
                    chatHistory.push({ role: 'user', parts: [{ text }] });

                    // Check if user is asking about a specific movie from the suggested list (fast path)
                    let foundMovie = suggestedMovies.find(movie => 
                        movie.tmdb.title && text.toLowerCase().includes(movie.tmdb.title.toLowerCase())
                    );

                    if (foundMovie) {
                        const movieDetails = await fetchMovieDetailsFromTMDB(foundMovie.tmdb.id);
                        displayMovieDetails(movieDetails);
                        chatHistory.push({ role: 'model', parts: [{ text: `Here are more details on ${movieDetails.title}.` }] });

                    } else {
                        // User is asking about a *new* movie or just general chat.
                        // Use the same extraction logic from Step 1.
                        const analysis = await callGeminiAPI(chatHistory, movieTitleExtractionInstruction, movieTitleExtractionSchema);

                        if (analysis && analysis.movieTitle && analysis.movieTitle.trim() !== "") {
                            // Gemini found a movie title! Let's search TMDB.
                            // We can reuse the new helper function
                            await searchAndDisplayMovie(analysis.movieTitle);
                        } else {
                            // Just a normal chat message, get a simple text response
                            const modelResponse = await callGeminiAPI(chatHistory); 
                            displayMessage(modelResponse, 'model');
                            chatHistory.push({ role: 'model', parts: [{ text: modelResponse }] });
                        }
                    }
                }
                // --- OLD 'ELSE' for 'type start' is removed ---

            } catch (error) {
                console.error('Error handling user response:', error);
                displayMessage('Sorry, I ran into an error. Please try again.', 'model');
            } finally {
                setLoading(false);
            }
        }

        // --- NEW: GEMINI API CALL (FOR GENERATING QUESTIONS) ---
        async function generateDynamicQuestions() {
            const systemInstruction = {
                parts: [{ text: "You are a creative interviewer. Generate 5 unique and interesting questions to understand a user's movie preferences. Return *only* a JSON array of strings, where each string is a question." }]
            };
            const schema = {
                type: "ARRAY",
                items: {
                    type: "STRING"
                }
            };
            const promptHistoryForQuestions = [ // New history just for question generation
                { role: 'user', parts: [{ text: "Generate 5 unique movie preference questions." }] }
            ];

            try {
                const newQuestions = await callGeminiAPI(promptHistoryForQuestions, systemInstruction, schema);
                if (Array.isArray(newQuestions) && newQuestions.length === 5) {
                    dynamicQuestions = newQuestions;
                } else {
                    console.warn("Gemini did not return 5 questions, using fallback.");
                    dynamicQuestions = [...questions]; // Fallback to preset questions
                }
            } catch (error) {
                console.error("Error generating dynamic questions:", error);
                displayMessage("Oops! I couldn't come up with new questions right now. I'll use some classic ones instead.", 'model');
                dynamicQuestions = [...questions]; // Fallback to preset questions
            }
        }


        // --- GEMINI API CALL (FOR MOVIE SUGGESTIONS) ---
        async function generateMovieSuggestions() {
            const preferences = dynamicQuestions.map((q, i) => `${q}: ${userAnswers[i]}`).join('\n');
            
            const systemInstruction = {
                parts: [{ text: "You are a movie expert. Based on the user's preferences, suggest 5 movies. Return *only* a JSON array of objects, where each object has a 'title' (string) and 'oneliner' (a very brief, catchy, one-sentence tagline for the movie)." }]
            };

            const promptHistory = [
                ...chatHistory, // Include previous chat history
                { role: 'user', parts: [{ text: `Here are my preferences:\n${preferences}\nPlease give me 5 movie suggestions in the specified JSON format.` }] }
            ];

            const schema = {
                type: "ARRAY",
                items: {
                    type: "OBJECT",
                    properties: {
                        "title": { "type": "STRING" },
                        "oneliner": { "type": "STRING" }
                    },
                    required: ["title", "oneliner"]
                }
            };

            try {
                const movies = await callGeminiAPI(promptHistory, systemInstruction, schema);
                
                if (!Array.isArray(movies) || movies.length < 5) {
                     // Need at least 5 movies
                     throw new Error("Gemini did not return 5 movie suggestions.");
                }

                const movieDataPromises = movies.slice(0, 5).map(movie => 
                    searchTMDB(movie.title, movie.oneliner) 
                );
                const movieDataArray = await Promise.all(movieDataPromises);
                suggestedMovies = movieDataArray; // Store the movies

                // --- NEW HORIZONTAL CAROUSEL LOGIC ---

                // 1. Display the title message first
                displayMessage("Here are 5 movies I think you'll enjoy:", 'model');

                    const posterPath = tmdb.poster_path 
                        ? `https://image.tmdb.org/t/p/w342/${tmdb.poster_path}` // w342 is a good card size
                        : 'https://placehold.co/150x225/374151/9ca3af?text=No+Image';
                    const rating = tmdb.vote_average ? tmdb.vote_average.toFixed(1) : 'N/A';
                    const movieId = tmdb.id;

                    const cardEl = document.createElement('div');
                    cardEl.className = 'flex-shrink-0 w-40 rounded-lg bg-gray-900/50 backdrop-blur-sm border border-white/10 overflow-hidden shadow-lg';
                    cardEl.innerHTML = `
                        <img src="${posterPath}" alt="${title} poster" class="w-full h-56 object-cover poster-clickable" data-movie-id="${movieId}">
                        <div class="p-2.5">
                            <h4 class="text-sm font-bold truncate text-white">${title}</h4>
                            <span class="text-xs font-semibold text-yellow-400 block mt-0.5">⭐ ${rating}</span>
                            ${movieId ? `<button class="watch-trailer-btn bg-white text-black w-full mt-2 px-2 py-1.5 rounded-md font-bold text-xs hover:bg-gray-200 transition-colors" data-movie-id="${movieId}">Watch Trailer</button>` : ''}
                        </div>
                    `;
                    
                    // Add trailer button listener
                    const trailerButton = cardEl.querySelector('.watch-trailer-btn');
                    if (trailerButton) {
                        trailerButton.addEventListener('click', async (e) => {
                            e.stopPropagation(); // Prevent card click from firing too
                            const id = e.target.dataset.movieId;
                            if (id) await openTrailerModal(id);
                        });
                        // Add cursor hover for desktop
                        if (!isTouchDevice) {
                            trailerButton.addEventListener('mouseenter', () => {
                                cursorFollowerEl.style.width = '45px';
                                cursorFollowerEl.style.height = '45px';
                            });
                            trailerButton.addEventListener('mouseleave', () => {
                                cursorFollowerEl.style.width = '30px';
                                cursorFollowerEl.style.height = '30px';
                            });
                        }
                    }
                    
                    // NEW: Add poster click listener
                    const posterImage = cardEl.querySelector('.poster-clickable');
                    if (posterImage) {
                        if (!isTouchDevice) {
                            // Add hover effects for the custom cursor
                            posterImage.style.cursor = 'none'; // Handled by follower
                            posterImage.addEventListener('mouseenter', () => {
                                cursorFollowerEl.style.width = '45px';
                                cursorFollowerEl.style.height = '45px';
                            });
                            posterImage.addEventListener('mouseleave', () => {
                                cursorFollowerEl.style.width = '30px';
                                cursorFollowerEl.style.height = '30px';
                            });
                        }
                        posterImage.addEventListener('click', async (e) => {
                            const id = e.target.dataset.movieId;
                            if (id) {
                                await showMovieCardDetails(id);
                            }
                        });
                    }

                    
                    carouselInner.appendChild(cardEl);
                });

                carouselContainer.appendChild(carouselInner);
                chatContainer.appendChild(carouselContainer); // Append carousel to chat
                
                // --- END HORIZONTAL CAROUSEL LOGIC ---


                // 8. Scroll to bottom
                scrollToBottom();

                // Update chat history
                chatHistory.push({ role: 'model', parts: [{ text: "Here are the 5 movies I suggested: " + movies.map(m => m.title).join(', ') }]});

                // 9. Add the follow-up message *after* the list
                displayMessage("What do you think of these? Feel free to ask me more about them!", 'model');

            } catch (error)
            {
                console.error("Error generating movie suggestions:", error);
                displayMessage("Sorry, I had trouble getting those suggestions. Let's try chatting instead.", 'model');
            }
        }

        // --- GEMINI API CALL (GENERAL) ---
        async function callGeminiAPI(history, systemInstruction = null, schema = null) {
            if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
                throw new Error("Invalid Gemini API Key. Please replace the placeholder.");
            }
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GEMINI_API_KEY}`;
            
            const payload = {
                contents: history,
            };

            if (systemInstruction) {
                payload.systemInstruction = systemInstruction;
            }

            if (schema) {
                payload.generationConfig = {
                    responseMimeType: "application/json",
                    responseSchema: schema
                };
            }
            
            let response;
            let delay = 1000;
            for (let i = 0; i < 3; i++) { // Retry mechanism
                response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) break;
                if (response.status === 429 || response.status >= 500) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                } else {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }
            }

            if (!response.ok) {
                throw new Error(`API call failed after retries: ${response.status} ${response.statusText}`);
            }
            const result = await response.json();
            if (!result.candidates || !result.candidates[0].content.parts[0]) {
                 throw new Error("Invalid API response from Gemini.");
            }
            const text = result.candidates[0].content.parts[0].text;
            return schema ? JSON.parse(text) : text;
        }

        // --- TMDB API CALL ---
        async function searchTMDB(movieTitle, oneliner) { 
            if (TMDB_API_KEY === "YOUR_TMDB_API_KEY_HERE") {
                throw new Error("Invalid TMDB API Key. Please replace the placeholder.");
            }
            const searchUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movieTitle)}`;
            try {
                const response = await fetch(searchUrl);
                if (!response.ok) throw new Error('TMDB search failed');
                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    return { tmdb: data.results[0], oneliner: oneliner };
                }
                return { tmdb: { title: movieTitle }, oneliner: oneliner }; // Fallback with just title
            } catch (error) {
                console.error('Error fetching from TMDB:', error);
                return { tmdb: { title: movieTitle }, oneliner: oneliner }; // Fallback with just title
            }
        }

        // --- TMDB API CALL FOR DETAILS (INCLUDING VIDEOS) ---
        async function fetchMovieDetailsFromTMDB(movieId) {
            if (TMDB_API_KEY === "YOUR_TMDB_API_KEY_HERE") {
                throw new Error("Invalid TMDB API Key. Please replace the placeholder.");
            }
            const detailUrl = `https://api.themoviedb.org/3/movie/${movieId}?api_key=${TMDB_API_KEY}&append_to_response=credits,videos`; // Added ,videos
            try {
                const response = await fetch(detailUrl);
                if (!response.ok) throw new Error('TMDB detail fetch failed');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching movie details from TMDB:', error);
                return null; // Fallback
            }
        }

        // --- NEW HELPER FUNCTION TO SEARCH/DISPLAY (to avoid repeating code) ---
        async function searchAndDisplayMovie(movieTitle) {
            // Helper function to search TMDB and display details
            try {
                const searchData = await searchTMDB(movieTitle, "");
                if (searchData && searchData.tmdb && searchData.tmdb.id) {
                    const movieDetails = await fetchMovieDetailsFromTMDB(searchData.tmdb.id);
                    displayMovieDetails(movieDetails);
                    chatHistory.push({ role: 'model', parts: [{ text: `Here are details on ${movieDetails.title}.` }] });
                } else {
                    displayMessage(`Sorry, I couldn't find any details for "${movieTitle}".`, 'model');
                    chatHistory.push({ role: 'model', parts: [{ text: "Couldn't find that movie." }] });
                }
            } catch (error) {
                console.error("Error in searchAndDisplayMovie:", error);
                displayMessage("Sorry, I ran into an error trying to find that movie.", 'model');
            }
        }


        // --- UI HELPER FUNCTIONS ---

        function displayMessage(text, sender) {
            const messageEl = document.createElement('div');
            const bubbleEl = document.createElement('div');

            if (sender === 'user') {
                messageEl.className = 'flex justify-end';
                bubbleEl.className = 'bg-white/30 text-white backdrop-blur-sm p-3 rounded-xl max-w-xs sm:max-w-sm md:max-w-md shadow-md';
                bubbleEl.textContent = text;
            } else {
                messageEl.className = 'flex justify-start';
                bubbleEl.className = 'bg-black/30 text-gray-200 backdrop-blur-sm p-3 rounded-xl max-w-xs sm:max-w-sm md:max-w-md shadow-md prose prose-invert prose-sm';
                bubbleEl.innerHTML = marked.parse(text);
            }
            
            messageEl.appendChild(bubbleEl);
            chatContainer.appendChild(messageEl);
            scrollToBottom();

        // --- UI HELPER FOR MOVIE DETAILS (REDESIGNED) ---
        async function displayMovieDetails(movie) {
            if (!movie) {
                displayMessage("Sorry, I couldn't find details for that movie.", 'model');
                return;
            }

            // 1. Create the message container
            const messageEl = document.createElement('div');
            messageEl.className = 'flex justify-start'; // Model message alignment

            // 2. Create the bubble (the new card)
            const bubbleEl = document.createElement('div');
            bubbleEl.className = 'bg-black/30 backdrop-blur-sm rounded-xl shadow-md w-full max-w-md text-left overflow-hidden'; // Mobile-friendly max-width

            // --- Helper data extraction ---
            const posterPath = movie.poster_path 
                ? `https://image.tmdb.org/t/p/w500/${movie.poster_path}`
                : 'https://placehold.co/300x450/374151/9ca3af?text=No+Poster';
            
            // NEW: Get backdrop path, fallback to poster
            const backdropPath = movie.backdrop_path
                ? `https://image.tmdb.org/t/p/w780/${movie.backdrop_path}`
                : posterPath;
            
            const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';
            const releaseDate = movie.release_date ? new Date(movie.release_date).getFullYear() : 'N/A';
            const runtime = movie.runtime ? `${movie.runtime} min` : 'N/A';
            const genres = movie.genres.map(g => g.name).join(', ');
            const director = movie.credits.crew.find(c => c.job === 'Director')?.name || 'N/A';
            const cast = movie.credits.cast.slice(0, 5); // Get top 5 cast objects
            const tagline = movie.tagline ? `"${movie.tagline}"` : '';
            const movieId = movie.id; // Get movie ID for trailer

            // --- Build HTML for cast list (horizontal scroll) ---
            const castHTML = cast.map(actor => {
                const actorImgPath = actor.profile_path 
                    ? `https://image.tmdb.org/t/p/w185${actor.profile_path}`
                    : 'https://placehold.co/100x150/454F63/9ca3af?text=No+Photo';
                
                return `
                    <div class="flex flex-col items-center text-center w-24 flex-shrink-0">
                        <img src="${actorImgPath}" alt="${actor.name}" class="w-20 h-20 rounded-full object-cover border-2 border-white/20 shadow-md">
                        <span class="text-xs text-white mt-2">${actor.name}</span>
                        <span class="text-xs text-gray-400">${actor.character}</span>
                    </div>
                `;
            }).join('');
            // --- END CAST HTML ---


            // 3. Populate Bubble HTML (New Card Design)
            bubbleEl.innerHTML = `
                <!-- Backdrop Header --><div class="relative h-48 md:h-64">
                    <img src="${backdropPath}" alt="${movie.title} backdrop" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div> <!-- NEW: Gradient overlay -->
                    <div class="absolute bottom-0 left-0 p-4">
                        <h2 class="text-3xl font-bold text-white">${movie.title}</h2>
                        <p class="text-md text-gray-300 italic mt-1">${tagline}</p>
                    </div>
                </div>
                
                <div class="p-4 space-y-4">
                    <!-- Rating, Year, Runtime --><div class="flex flex-wrap gap-x-4 gap-y-2 text-sm text-gray-200">
                        <span class="font-semibold text-yellow-400">⭐ ${rating} / 10</span>
                        <span>${releaseDate}</span>
                        <span>${runtime}</span>
                    </div>
                    
                    <!-- Trailer Button -->${movieId ? `<div class="flex justify-start">
                        <button class="watch-trailer-btn bg-white text-black px-6 py-2 rounded-lg font-bold text-sm hover:bg-gray-200 transition-colors" data-movie-id="${movieId}">Watch Trailer</button>
                    </div>` : ''}
                    
                    <!-- Overview --><div>
                        <h4 class="text-sm font-semibold text-gray-400 uppercase">Overview</h4>
                        <p class="text-gray-200 prose prose-invert prose-sm">${movie.overview}</p>
                    </div>
                    
                    <!-- Genres --><div>
                        <h4 class="text-sm font-semibold text-gray-400 uppercase">Genres</h4>
                        <p class="text-gray-200">${genres}</p>
                    </div>
                    
                    <!-- Director --><div>
                        <h4 class="text-sm font-semibold text-gray-400 uppercase mb-3">Director</h4>
                        <p class="text-gray-200">${director}</p>
                    </div>
                    
                    <!-- Starring (Horizontal Scroll) --><div>
                        <h4 class="text-sm font-semibold text-gray-400 uppercase mb-3">Starring</h4>
                        <div class="w-full overflow-x-auto horizontal-scrollbar">
                            <div class="flex space-x-4">
                                ${castHTML}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // 4. Append to chat
            messageEl.appendChild(bubbleEl);
            chatContainer.appendChild(messageEl);

            // NEW: Add event listener for the "Watch Trailer" button in the detailed view
            const detailTrailerButton = bubbleEl.querySelector('.watch-trailer-btn');
            if (detailTrailerButton) {
                if (!isTouchDevice) {
                    detailTrailerButton.addEventListener('mouseenter', () => {
                        cursorFollowerEl.style.width = '45px';
                        cursorFollowerEl.style.height = '45px';
                    });
                    detailTrailerButton.addEventListener('mouseleave', () => {
                        cursorFollowerEl.style.width = '30px';
                        cursorFollowerEl.style.height = '30px';
                    });
                }
                detailTrailerButton.addEventListener('click', async (e) => {
                    const id = e.target.dataset.movieId;
                    if (id) {
                        await openTrailerModal(id);
                    }
                });
            }

            scrollToBottom();
        }

        // --- UPDATED: setLoading function ---
        function setLoading(isLoading) {
            if (isLoading) {
                // 1. Create and append new loading bubble
                if (!currentLoadingEl) {
                    const messageEl = document.createElement('div');
                    messageEl.className = 'flex justify-start';
                    
                    const bubbleEl = document.createElement('div');
                    bubbleEl.className = 'bg-black/30 text-gray-200 backdrop-blur-sm p-3 rounded-xl shadow-md inline-flex items-center';
                    
                    // --- MODIFIED: Updated text and spinner ---
                    bubbleEl.innerHTML = `
                        <span class="text-sm text-gray-300">Thinking</span>
                        <div class="elegant-spinner"></div>
                    `;
                    // --- END MODIFICATION ---
                    
                    messageEl.appendChild(bubbleEl);
                    chatContainer.appendChild(messageEl);
                    currentLoadingEl = messageEl; // Store reference
                    scrollToBottom();
                }
                userInput.disabled = true;
                sendButton.disabled = true;
            } else {
                // 2. Remove loading bubble
                if (currentLoadingEl) {
                    chatContainer.removeChild(currentLoadingEl);
                    currentLoadingEl = null;
                }
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        // MODIFIED: Scrolls the main element now
        function scrollToBottom() {
            mainScrollArea.scrollTop = mainScrollArea.scrollHeight;
        }

        // --- NEW: TRAILER MODAL FUNCTIONS ---
        async function openTrailerModal(movieId) {
            try {
                const movieDetails = await fetchMovieDetailsFromTMDB(movieId);
                if (movieDetails && movieDetails.videos && movieDetails.videos.results.length > 0) {
                    const trailer = movieDetails.videos.results.find(video => video.type === 'Trailer' && video.site === 'YouTube') || movieDetails.videos.results[0]; // Fallback to first video
                    
                    if (trailer && trailer.site === 'YouTube') {
                        trailerIframe.src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1`;
                        trailerModal.classList.add('open');
                    } else {
                        // Create a simple text alert inside the app
                        displayMessage("Sorry, I couldn't find a YouTube trailer for this movie.", 'model');
                    }
                } else {
                    displayMessage("Sorry, no video information available for this movie.", 'model');
                }
            } catch(e) {
                 displayMessage("Sorry, I ran into an error trying to get the trailer.", 'model');
            }
        }

        function closeTrailerModal() {
            trailerModal.classList.remove('open');
            trailerIframe.src = ''; // Stop the video
        }

        // --- START THE APP ---
        init();

    </script>
